# Supabase に接続しないときに使う見本の知識。公式サイトで公開されている内容だけを入れる。
- id: sample-1
  category: rule
  step_no: 1
  question: 入店したらまず何をすればいいですか？
  answer: お店に入ったら、まず注文用の公式LINEにアクセスしてください。店内のQRコードをスキャンしてください。
- id: sample-2
  category: payment
  step_no: 2
  question: 支払い方法は？
  answer: 店頭では現金とPayPayが使えます。公式LINEから事前に注文することもできます。
- id: sample-3
  category: cooking
  step_no: 3
  question: 麺の茹で方と茹で時間を教えてください。
  answer: 麺は袋から出してテボに入れ、麺用の釜で茹でてください。標準は10分です。
- id: sample-4
  category: rule
  question: 持ち込んではいけないものはありますか？
  answer: 麺以外のドリンクや電子レンジで調理できるものは持ち込み自由です。麺の持ち込みはできません。
