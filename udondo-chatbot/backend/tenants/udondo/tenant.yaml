# 惑星のウドンドの設定。見本の無料版で使う。
tenant_id: udondo
shop_name: 惑星のウドンド
languages: [ja, en, zh-Hans, zh-Hant, ko]
default_language: ja
features:
  voice: false
  avatar: false
  image_input: false
llm:
  model: gemini-3.5-flash-lite
  temperature: 0.3
  max_output_tokens: 300
  history_turns: 3
limits:
  session_turns: 20
  session_idle_minutes: 30
  ip_per_minute: 10
  daily_cost_jpy: 50
  question_chars: 300
links:
  line_help: https://line.me/R/ti/p/@771ypyse
usd_jpy: 158.73
# 店のリンクを知識として足す。URL は LLM に見せず、参照されたときに画面のボタンとして出す
link_knowledge:
  - id: link-line
    category: link
    question: 公式LINEのURLは？友だち追加の方法は？
    answer: 公式LINEは、この答えの下のボタンから開ける。LINEで「ウドンド」と検索して友だち追加することもできる。
    link_url: https://line.me/R/ti/p/@771ypyse
    # 回答の本文にこの語が出たら、参照の番号がなくてもボタンを付ける
    mention_keywords: [LINE, ライン]
